name: merchant-content-hub
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: merchant_content_hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在.env设置POSTGRES_PASSWORD}
    volumes:
      - hub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d merchant_content_hub"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
  api:
    image: merchant-content-hub-api:local
    build:
      context: .
      target: api-runner
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://hub:${POSTGRES_PASSWORD}@db:5432/merchant_content_hub
      DATA_DIR: /app/data
      LEGACY_SQLITE_PATH: /app/data/hub.sqlite
      SEED_DEMO: ${SEED_DEMO:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-128}
      HUB_ACCESS_TOKEN: ${HUB_ACCESS_TOKEN:-}
      HUB_ALLOWED_ORIGINS: ${HUB_ALLOWED_ORIGINS:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      ASR_WORKER_ENABLED: ${ASR_WORKER_ENABLED:-true}
      ASR_PROVIDER: ${ASR_PROVIDER:-openai}
      ASR_BASE_URL: ${ASR_BASE_URL:-}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_MODEL: ${ASR_MODEL:-whisper-1}
      ASR_TIMEOUT_SECONDS: ${ASR_TIMEOUT_SECONDS:-180}
      TTS_WORKER_ENABLED: ${TTS_WORKER_ENABLED:-true}
      TTS_BASE_URL: ${TTS_BASE_URL:-}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_MODEL: ${TTS_MODEL:-cosyvoice-v3-flash}
      DOUYIN_WORKER_ENABLED: ${DOUYIN_WORKER_ENABLED:-true}
      NARRATION_WORKER_ENABLED: ${NARRATION_WORKER_ENABLED:-true}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_MODEL: ${VISION_MODEL:-qwen3.8-flash}
    volumes:
      - hub-data:/app/data
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
  web:
    image: merchant-content-hub:local
    build:
      context: .
      target: web-runner
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:${HUB_PORT:-3100}:3100"
    environment:
      API_INTERNAL_URL: http://api:3101
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
volumes:
  hub-data:
  hub-postgres:
