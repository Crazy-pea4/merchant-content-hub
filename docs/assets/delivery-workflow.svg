<svg xmlns="http://www.w3.org/2000/svg" width="509.27559055118115" height="600" viewBox="0 0 509.27559055118115 600" role="img">
<title>商家内容制作与交付流程图</title>
<rect width="100%" height="100%" fill="white"/>
<rect x="55" y="6.0" width="330" height="42" rx="8" fill="#FFFFFF" stroke="#DBE5E0"/>
<text x="220" y="23" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#25383A">01 明确服务与交付物</text>
<text x="220" y="39" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.7" fill="#667A78">原片、成片或代运营，约定数量与时间</text>
<rect x="55" y="64.0" width="330" height="42" rx="8" fill="#EEF4EF" stroke="#DBE5E0"/>
<text x="220" y="81" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#25383A">02 素材入库并核对转写</text>
<text x="220" y="97" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.7" fill="#667A78">当前项目素材库，确认授权与关键文字</text>
<rect x="55" y="122.0" width="330" height="42" rx="8" fill="#FFFFFF" stroke="#DBE5E0"/>
<text x="220" y="139" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#25383A">03 确认选题与脚本</text>
<text x="220" y="155" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.7" fill="#667A78">人工核对，并与商家确认表达方向</text>
<rect x="55" y="180.0" width="330" height="42" rx="8" fill="#FFF3EA" stroke="#DBE5E0"/>
<text x="220" y="197" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#25383A">04 按需拍摄或补拍</text>
<text x="220" y="213" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.7" fill="#667A78">现有素材够用时直接进入剪辑</text>
<rect x="55" y="238.0" width="330" height="42" rx="8" fill="#FFF3EA" stroke="#DBE5E0"/>
<text x="220" y="255" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#25383A">05 在外部工具剪辑成片</text>
<text x="220" y="271" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.7" fill="#667A78">完成画面、字幕及约定包装</text>
<rect x="55" y="296.0" width="330" height="42" rx="8" fill="#EEF4EF" stroke="#DBE5E0"/>
<text x="220" y="313" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#25383A">06 上传并关联最终成片</text>
<text x="220" y="329" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.7" fill="#667A78">同一项目上传MP4，关联后提交审核</text>
<polyline points="220,48 220,64" fill="none" stroke="#667A78" stroke-width="1.1"/>
<polygon points="220,64 222.8,58.0 217.2,58.0" fill="#667A78" stroke="#667A78"/>
<polyline points="220,106 220,122" fill="none" stroke="#667A78" stroke-width="1.1"/>
<polygon points="220,122 222.8,116.0 217.2,116.0" fill="#667A78" stroke="#667A78"/>
<polyline points="220,164 220,180" fill="none" stroke="#667A78" stroke-width="1.1"/>
<polygon points="220,180 222.8,174.0 217.2,174.0" fill="#667A78" stroke="#667A78"/>
<polyline points="220,222 220,238" fill="none" stroke="#667A78" stroke-width="1.1"/>
<polygon points="220,238 222.8,232.0 217.2,232.0" fill="#667A78" stroke="#667A78"/>
<polyline points="220,280 220,296" fill="none" stroke="#667A78" stroke-width="1.1"/>
<polygon points="220,296 222.8,290.0 217.2,290.0" fill="#667A78" stroke="#667A78"/>
<polyline points="220,338 220,356" fill="none" stroke="#667A78" stroke-width="1.1"/>
<polygon points="220,356 222.8,350.0 217.2,350.0" fill="#667A78" stroke="#667A78"/>
<polygon points="220,356 316,382 220,408 124,382" fill="#FFFFFF" stroke="#3C6252"/>
<text x="220" y="379" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#25383A">07 商家成片审核</text>
<text x="220" y="393" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="8" fill="#667A78">确认的是当前最终版本</text>
<polyline points="316,382 463,382 463,259 385,259" fill="none" stroke="#C96140" stroke-width="1.1"/>
<polygon points="385,259 391.0,261.8 391.0,256.2" fill="#C96140" stroke="#C96140"/>
<text x="414" y="331" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#C96140">有修改意见</text>
<text x="414" y="346" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" fill="#C96140">修改后重新提交</text>
<polyline points="220,408 220,434" fill="none" stroke="#667A78" stroke-width="1.1"/>
<polygon points="220,434 222.8,428.0 217.2,428.0" fill="#667A78" stroke="#667A78"/>
<text x="242" y="423" text-anchor="start" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" fill="#3C6252">通过</text>
<rect x="55" y="434" width="330" height="42" rx="8" fill="#FFF3EA" stroke="#DBE5E0"/>
<text x="220" y="451" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#25383A">08 实际交接最终文件</text>
<text x="220" y="467" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.7" fill="#667A78">通过微信、网盘或可访问地址交接</text>
<rect x="55" y="499" width="330" height="42" rx="8" fill="#EEF4EF" stroke="#DBE5E0"/>
<text x="220" y="516" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#25383A">09 团队登记确认交付</text>
<text x="220" y="532" text-anchor="middle" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.7" fill="#667A78">真实交接完成后，更新当前内容状态</text>
<polyline points="220,476 220,499" fill="none" stroke="#667A78" stroke-width="1.1"/>
<polygon points="220,499 222.8,493.0 217.2,493.0" fill="#667A78" stroke="#667A78"/>
<rect x="60" y="568" width="10" height="10" rx="2" fill="#EEF4EF" stroke="#DBE5E0"/>
<text x="76" y="577" text-anchor="start" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" fill="#667A78">平台内操作</text>
<rect x="220" y="568" width="10" height="10" rx="2" fill="#FFF3EA" stroke="#DBE5E0"/>
<text x="236" y="577" text-anchor="start" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" fill="#667A78">团队实际执行</text>
<rect x="380" y="568" width="10" height="10" rx="2" fill="#FFFFFF" stroke="#DBE5E0"/>
<text x="396" y="577" text-anchor="start" font-family="Arial Unicode MS, PingFang SC, Microsoft YaHei, sans-serif" font-size="8.5" fill="#667A78">人工确认</text>
</svg>